<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>会话修复助手 · Codex</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="会话修复助手首页"><img src="/icon.svg" alt="" width="37" height="37"><span><strong>会话修复助手</strong><small>CODEX · LOCAL REPAIR</small></span></a>
    <nav class="nav" aria-label="主导航"><button class="nav-button active" id="automaticTab">自动守护</button><button class="nav-button" id="sessionsTab">会话检查</button><button class="nav-button" id="backupsTab">修复记录<span class="pending-count hidden" id="pendingCount"></span></button></nav>
    <div class="header-right"><span class="local-badge"><i></i>仅本机运行</span><button class="quiet small" id="exitButton">退出工具</button></div>
  </header>
  <div class="layout" id="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-heading"><h1>查找会话</h1><span id="resultCount" class="muted">正在读取…</span></div>
      <label class="search-box"><span class="search-glyph" aria-hidden="true">⌕</span><input type="search" id="searchInput" placeholder="会话 ID、恢复命令或标题" aria-label="搜索会话" autocomplete="off"></label>
      <div class="filters"><select id="kindFilter" aria-label="会话类型"><option value="main">主会话</option><option value="all">所有会话</option><option value="agents">子代理</option><option value="errors">有此报错记录</option></select><label class="check-label"><input type="checkbox" id="archiveFilter">含归档</label></div>
      <div class="session-list" id="sessionList" aria-live="polite"></div>
      <button class="load-more hidden" id="loadMore">加载更多</button>
      <div class="data-source"><span class="eyebrow">当前数据目录</span><span id="dataHome" title="">正在读取…</span></div>
    </aside>
    <main class="workspace" id="workspace">
      <div id="notice" class="notice hidden" role="alert"></div>
      <section id="jobPanel" class="job-panel hidden" aria-live="polite"><span class="spinner"></span><div><strong id="jobMessage">正在处理</strong><span id="jobDetail">请保持工具运行，完成后会显示结果。</span></div><progress id="jobProgress" max="1" value="0" aria-label="处理进度"></progress></section>
      <div id="content"></div>
    </main>
  </div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
</body>
</html>
